# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  packages: !include_dir_named packages

recorder:
  purge_keep_days: 30

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

template:
  - sensor:
      - name: >-
          {{ state_attr('switch.exercise_room_viziotv', 'friendly_name') or 'Exercise Room VizioTV' }} Daily Cost
        unique_id: exercise_room_viziotv_daily_cost
        unit_of_measurement: "USD"
        device_class: monetary
        state_class: total
        state: >-
          {{ (states('sensor.exercise_room_viziotv_today_s_consumption')|float(0) * states('sensor.rpu_electricity_price')|float(0)) | round(3) }}
      - name: >-
          {{ state_attr('switch.unnamed_p316m_co2_generator', 'friendly_name') or 'CO2 Generator' }} Daily Cost
        unique_id: aquarium_co2_generator_daily_cost
