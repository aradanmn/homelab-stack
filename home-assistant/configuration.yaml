        unique_id: dryer_running
        state_class: measurement
        state: >-
          {{ 1 if states('binary_sensor.electric_dryer_power') == 'on' else 0 }}
      # 2026-11-10: the match now allows a _2/_3 suffix. Outlets on the 2nd and
      # 3rd Tapo strips get one (name collision), and 5 of them (23.7 W,
      # including the NAS) were silently left out of this sum.
      # 2026-09-16: replaces a hand-maintained 28-entity array (same
      # fragility as the Sense list above) with integration_entities('tplink'),
      # which covers both the Tapo P316M plugs and the Kasa HS300 strip under
      # one HA integration domain -- a new TP-Link plug is included automatically.
      # The one exclusion is necessary: the HS300 strip exposes its own
      # whole-strip aggregate sensor alongside its 6 per-outlet children, which
      # would double-count if included. Verified live: 28 entities, sum exactly
      # matches the old hardcoded list's live value.
      - name: "Home Energy Explained (Tapo/Kasa)"
        unique_id: home_energy_explained_watts
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% set entities = integration_entities('tplink')
              | select('match', '^sensor\..*_current_consumption(_[0-9]+)?$')
              | reject('eq', 'sensor.tp_link_power_strip_2d1e_current_consumption')
              | list %}
          {{ entities | map('states') | map('float', 0) | sum | round(1) }}
      # 2026-09-16: replaces a hand-maintained entity list that had already
      # silently drifted (missing fridge_2_power, and every new Sense-identified
      # appliance since) -- integration_entities('sense') enumerates every
      # per-appliance power sensor Sense currently has, so a newly-identified
      # device (like today's dishwasher) is included automatically on its next
      # state change, no config edit required. The sense_[0-9] reject excludes
      # the whole-home monitor's own aggregate sensors (sense_<id>_energy etc),
      # which share the integration but aren't a per-appliance reading.
      - name: "Home Energy Identified (Sense)"
        unique_id: home_energy_identified_sense_watts
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% set sense_power_entities = integration_entities('sense')
              | select('match', '^sensor\..*_power$')
              | reject('match', '^sensor\.sense_[0-9]')
              | list %}
          {{ sense_power_entities | map('states') | map('float', 0) | sum | round(1) }}
      # 2026-11-10: the plug sum and the identified sum both count a load that is on
      # a smart plug AND was detected by Sense as its own device. Sense lists the
      # Keurig's heating element as "Mystery Heat 4": it peaks at 1,329 to 1,393 W
      # every day, the Keurig plug at 1,355 to 1,396 W, at the same minutes. Counted
      # twice, "unexplained" dips by about 1,400 W (down to -2,500 W) whenever the
      # coffee maker heats. This sum leaves out the devices listed in on_a_plug and
      # is what "unexplained" and the plugs + identified + unexplained chart use.
      # If Sense later identifies another device that is also on a plug, add it here.
      - name: "Home Energy Identified Off-Plug (Sense)"
        unique_id: home_energy_identified_off_plug_watts
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {% set on_a_plug = ['sensor.mystery_heat_4_power'] %}
          {% set sense_power_entities = integration_entities('sense')
              | select('match', '^sensor\..*_power$')
              | reject('match', '^sensor\.sense_[0-9]')
              | reject('in', on_a_plug)
              | list %}
          {{ sense_power_entities | map('states') | map('float', 0) | sum | round(1) }}
      - name: "Home Energy Unexplained"
        unique_id: home_energy_unexplained_watts
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >-
          {{ (states('sensor.sense_1000019509_energy')|float(0)
              - states('sensor.home_energy_explained_tapo_kasa')|float(0)
              - states('sensor.home_energy_identified_off_plug_sense')|float(0)) | round(1) }}

# 2026-11-13: filtered copy of `unexplained`, for the Sense Power chart only (the alert
# keeps the raw value). The plugs report about every 5 s, Sense (whole home and its
# devices) about every 30 s or slower, and Sense's own device sensors step at slightly
# different moments from its whole-home reading, so every big switch (the Keurig, 1,360 W;
# a 480 W Sense device overnight) makes a short dip then a spike in the subtraction.
# A 30 s average of the plug total was tried first (2026-11-12) and only helped ~15 %.
# This is the median of the last 3 minutes of readings: it drops anything shorter than
# about 90 s and passes real loads (furnace, stove) with about 1.5 minutes of delay.
# (The `filter` platform has no median; this must be `statistics`. `ha core check` does
# NOT flag a bad platform entry, only the log does: "Invalid config for 'sensor'".)
# The chart clips at 0 with min_y_axis: a negative unexplained load is never real.
# The source updates about twice a second, so 450 samples cover the 3 minutes.
sensor:
  - platform: statistics
    name: "Home Energy Unexplained Filtered"
    unique_id: home_energy_unexplained_filtered
    entity_id: sensor.home_energy_unexplained
    state_characteristic: median
    max_age:
      minutes: 3
    sampling_size: 450
    precision: 1

# 2026-09-16: include_entities was a second hand-maintained copy of the same
# Sense appliance list (also missing fridge_2_power and every appliance added
# since) -- include_entity_globs matches by naming convention instead, so any
# sensor.*_power, sensor.*_running, or sensor.home_energy_* (present or future)
# is scraped without a config edit. See homelab-stack Grafana alerting rules.yaml,
# which had its own third copy of this list and is fixed alongside this change.
# HomeKit Bridge Allowlist
homekit:
  - name: HASS Bridge
    port: 21064
    mode: bridge
    filter:
      # Reconciled against core.entity_registry (2026-10-18): only real
      # family-use devices. Locks and the garage cover are Matter-native
      # (excluded). The kitchen/bath/garage/porch/bedroom "light_*" names
      # never existed -- kitchenrmap_led, masterbdrmap_led etc. are Ubiquiti
      # access-point/switch LEDs, not room lighting.
      include_entities:
        - light.living_room_living_room_ceiling_fan_light
        - light.dining_room_dining_room_chandelier
        - light.family_room_family_room_floor_lamp
        - sensor.living_room_temperature
        - sensor.master_bedroom_temperature
        - sensor.kids_room_temperature
        - sensor.family_room_temperature
        - sensor.outdoor_temperature
        - binary_sensor.front_door_motion
        - binary_sensor.living_room_occupancy
        - binary_sensor.master_bedroom_occupancy
        - binary_sensor.kids_room_occupancy
