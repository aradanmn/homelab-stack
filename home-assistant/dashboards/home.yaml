# Home dashboard (HA's default dashboard, listed as "Overview", url /lovelace).
# UI-stored: HA keeps it in /config/.storage/lovelace.lovelace. This file is an export;
# paste it into Edit dashboard > ⋮ > Raw configuration editor to restore. See docs/home-assistant.md.
title: Home
views:
- title: Home
  path: home
  icon: mdi:home-heart
  type: sections
  max_columns: 3
  badges:
  - type: entity
    entity: person.scott_dean
  - type: entity
    entity: climate.thermostat
  - type: entity
    entity: weather.forecast_home
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: AI Home Summary
      icon: mdi:robot-outline
    - type: markdown
      content: '{{ states(''input_text.ai_home_summary'') if states(''input_text.ai_home_summary'') not in [''unknown'',''unavailable'',''''] else ''Tap Refresh to
        generate a summary.'' }}'
      grid_options:
        columns: 24
    - type: tile
      entity: script.ai_home_summary_refresh
      name: Refresh
      grid_options:
        columns: 12
      icon: mdi:refresh
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: On right now
      icon: mdi:lightbulb-on-outline
    - type: tile
      entity: fan.living_room_living_room_ceiling_fan
      name: Living Room Fan
      color: amber
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: fan.living_room_living_room_ceiling_fan
        state: 'on'
    - type: tile
      entity: light.living_room_living_room_ceiling_fan_light
      name: Living Room Light
      color: amber
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: light.living_room_living_room_ceiling_fan_light
        state: 'on'
    - type: tile
      entity: light.dining_room_dining_room_chandelier
      name: Dining Chandelier
      color: amber
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: light.dining_room_dining_room_chandelier
        state: 'on'
    - type: tile
      entity: fan.master_bedroom_master_bedroom_ceiling_fan
      name: Master Fan
      color: amber
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: fan.master_bedroom_master_bedroom_ceiling_fan
        state: 'on'
    - type: tile
      entity: switch.master_bedroom_master_bedroom_ceiling_fan_light
      name: Master Light
      color: amber
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: switch.master_bedroom_master_bedroom_ceiling_fan_light
        state: 'on'
    - type: tile
      entity: light.family_room_family_room_floor_lamp
      name: Family Floor Lamp
      color: amber
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: light.family_room_family_room_floor_lamp
        state: 'on'
    - type: tile
      entity: switch.exercise_room_exercise_room_main_lights
      name: Exercise Room
      color: amber
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: switch.exercise_room_exercise_room_main_lights
        state: 'on'
    - type: tile
      entity: switch.kids_room_kids_room_main_lights
      name: Playroom
      color: amber
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: switch.kids_room_kids_room_main_lights
        state: 'on'
    - type: tile
      entity: switch.office_office_main_lights
      name: Office
      color: amber
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: switch.office_office_main_lights
        state: 'on'
    - type: tile
      entity: switch.upstairs_hallway_upstairs_hallway_main_lights
      name: Upstairs Hallway
      color: amber
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: switch.upstairs_hallway_upstairs_hallway_main_lights
        state: 'on'
    - type: tile
      entity: switch.downstairs_hallway_downstairs_hallway_sconces
      name: Downstairs Hallway
      color: amber
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: switch.downstairs_hallway_downstairs_hallway_sconces
        state: 'on'
    - type: tile
      entity: switch.utility_room_utility_room_main_lights
      name: Utility Room
      color: amber
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: switch.utility_room_utility_room_main_lights
        state: 'on'
    - type: tile
      entity: switch.front_exterior_front_exterior_driveway_light
      name: Driveway
      color: amber
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: switch.front_exterior_front_exterior_driveway_light
        state: 'on'
    - type: tile
      entity: switch.front_exterior_front_exterior_string_lights
      name: String Lights
      color: amber
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: switch.front_exterior_front_exterior_string_lights
        state: 'on'
    - type: tile
      entity: switch.back_exterior_back_exterior_deck_lights
      name: Deck Lights
      color: amber
      grid_options:
        columns: 6
      visibility:
      - condition: state
        entity: switch.back_exterior_back_exterior_deck_lights
        state: 'on'
    - type: markdown
      content: All lights and fans are off.
      visibility:
      - condition: state
        entity: fan.living_room_living_room_ceiling_fan
        state_not: 'on'
      - condition: state
        entity: light.living_room_living_room_ceiling_fan_light
        state_not: 'on'
      - condition: state
        entity: light.dining_room_dining_room_chandelier
        state_not: 'on'
      - condition: state
        entity: fan.master_bedroom_master_bedroom_ceiling_fan
        state_not: 'on'
      - condition: state
        entity: switch.master_bedroom_master_bedroom_ceiling_fan_light
        state_not: 'on'
      - condition: state
        entity: light.family_room_family_room_floor_lamp
        state_not: 'on'
      - condition: state
        entity: switch.exercise_room_exercise_room_main_lights
        state_not: 'on'
      - condition: state
        entity: switch.kids_room_kids_room_main_lights
        state_not: 'on'
      - condition: state
        entity: switch.office_office_main_lights
        state_not: 'on'
      - condition: state
        entity: switch.upstairs_hallway_upstairs_hallway_main_lights
        state_not: 'on'
      - condition: state
        entity: switch.downstairs_hallway_downstairs_hallway_sconces
        state_not: 'on'
      - condition: state
        entity: switch.utility_room_utility_room_main_lights
        state_not: 'on'
      - condition: state
        entity: switch.front_exterior_front_exterior_driveway_light
        state_not: 'on'
      - condition: state
        entity: switch.front_exterior_front_exterior_string_lights
        state_not: 'on'
      - condition: state
        entity: switch.back_exterior_back_exterior_deck_lights
        state_not: 'on'
  - type: grid
    cards:
    - type: heading
