      name: Family Room
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.master_bedroom_temperature
      name: Master Bedroom
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.kids_room_temperature
      name: Playroom
