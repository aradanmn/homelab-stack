# Glances config for the homelab container (mounted read-only at /etc/glances/glances.conf).
# Only the host's real filesystems: the bind-mounted files Docker adds
# (/etc/hostname, /etc/hosts, /etc/resolv.conf, /usr/lib/os-release) otherwise
# show up as filesystems and become four extra sets of HA sensors.
[fs]
hide=/etc/.*,/usr/lib/os-release,/rootfs/boot/efi
