# LXC 105: /etc/systemd/system/docker.service.d/claude-secrets.conf
# Orders docker.service after the tmpfs secrets fetch, so any container the
# daemon brings back at boot finds its bind-mounted secret files instead of an
# empty directory Docker would create at a missing source. Wants= + After=
# order it without propagating a stop (a `systemctl restart claude-secrets`
# must not take docker down).
# 2026-11-01: the ExecStartPre= check on netbot-bots-token was removed with the
# netbot/manager bots (claude_sessions#27); nothing on 105 needs a fail-closed
# secret check to start Docker any more.
[Unit]
Wants=claude-secrets.service
After=claude-secrets.service
