# LXC 101: /etc/systemd/system/docker.service.d/homelab-stack-secrets.conf
# The compose file bind-mounts up.conf, pve.yml and ha_scrape_token from
# /run/homelab-stack; Docker creates an empty directory at a missing bind
# source, so the daemon (and the containers its restart policy brings back
# at boot) must wait for the tmpfs to be populated. homelab-stack.service
# already Requires= the secrets unit; this closes the same gap for a plain
# docker.service start. Wants= + After= order it without propagating a stop
# (a `systemctl restart homelab-stack-secrets` must not take docker down);
# the ExecStartPre= check is what fails closed when the fetch did not run.
[Unit]
Wants=homelab-stack-secrets.service
After=homelab-stack-secrets.service

[Service]
ExecStartPre=/usr/bin/test -s /run/homelab-stack/env
